[package]
name = "spt"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Safe OpenRouter-powered speech transcription and OCR CLI"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-recursion = "1.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
dirs = "6.0"
futures = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
